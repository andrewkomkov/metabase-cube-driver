cubes:
  - name: metric_types
    title: Metric types
    description: One measure of each Cube measure type, on shop.orders. The truth of each measure is the same aggregate in ClickHouse SQL.
    sql_table: shop.orders
    sql_alias: mt
    refresh_key: { every: 1 hour }
    meta: { owner: finance, ai_hint: "Use these measures to check how a measure type is shown." }
    dimensions:
      - { name: id, sql: id, type: number, primary_key: true, public: true }
      - { name: status, sql: status, type: string, public: true }
      - { name: quantity, sql: quantity, type: number, public: true }
      - { name: amount, sql: amount, type: number, public: true }
      - { name: user_id, sql: user_id, type: number, public: true }
      - { name: is_paid, sql: "status IN ('completed','shipped')", type: boolean, public: true }
      - { name: created_at, sql: created_at, type: time, public: true }
    measures:
      - { name: m_count, type: count, title: Orders, description: Rows of shop.orders. }
      - name: m_count_completed
        type: count
        title: Completed orders
        description: Count with one filter.
        filters:
          - { sql: "{CUBE}.status = 'completed'" }
      - name: m_count_large_completed
        type: count
        title: Large completed orders
        description: Count with two filters, combined with AND.
        filters:
          - { sql: "{CUBE}.status = 'completed'" }
          - { sql: "{CUBE}.quantity >= 3" }
      - { name: m_users, type: count_distinct, sql: user_id, title: Customers, description: Distinct customers. }
      - { name: m_users_approx, type: count_distinct_approx, sql: user_id, title: Customers (approx), description: Approximate distinct customers, from uniqHLL12. }
      - { name: m_revenue, type: sum, sql: amount, format: currency, title: Revenue, description: Sum of amount in USD. }
      - { name: m_avg_amount, type: avg, sql: amount, format: currency, title: Average order value, description: Average amount. }
      - { name: m_min_amount, type: min, sql: amount, title: Smallest order, description: Minimum amount. }
      - { name: m_max_amount, type: max, sql: amount, title: Largest order, description: Maximum amount. }
      - { name: m_quantity_sum, type: sum, sql: quantity, title: Units, description: Units sold. }
      - { name: m_ratio, type: number, sql: "{m_revenue} / NULLIF({m_count}, 0)", format: currency, title: Revenue per order, description: Revenue divided by orders, NULL when there are no orders. }
      - { name: m_status_text, type: string, sql: "any(status)", title: Some status, description: One status of the group. }
      - { name: m_last_order_at, type: time, sql: created_at, title: Last order, description: Time of the order in the group. }
      - { name: m_has_completed, type: boolean, sql: "{CUBE}.status = 'completed'", title: Has completed, description: True when the row is completed. }
      - { name: m_private_count, type: count, public: false, description: Not visible to people. }
      - name: m_formatted_count
        type: count
        title: Formatted count
        description: Count with a number format.
        format: number
        meta: { owner: finance }

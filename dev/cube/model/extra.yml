cubes:
  - name: payments
    title: Payments
    description: Two payment rows per order, from a SQL query.
    sql: >
      SELECT id AS payment_id, id AS order_id, 'card' AS method, amount AS paid
      FROM shop.orders
      UNION ALL
      SELECT id + 100000 AS payment_id, id AS order_id, 'fee' AS method, toDecimal64(1, 2) AS paid
      FROM shop.orders
    dimensions:
      - { name: id, sql: payment_id, type: number, primary_key: true, public: false }
      - { name: order_id, sql: order_id, type: number, description: Paid order. }
      - { name: method, sql: method, type: string, description: Payment method. }
    measures:
      - { name: count, type: count, description: Number of payments. }
      - { name: total, sql: paid, type: sum, format: currency, description: Total paid. }

  - name: promos
    title: Promos
    description: Ten promo codes. Orders join it twice through aliases.
    sql: "SELECT toInt32(number) AS id, concat('P', toString(number)) AS code FROM numbers(10)"
    dimensions:
      - { name: id, sql: id, type: number, primary_key: true, public: false }
      - { name: code, sql: code, type: string, description: Promo code. }
    measures:
      - { name: count, type: count, description: Number of promos. }

  - name: shipments
    title: Shipments
    description: One shipment per order. Joined one to one.
    sql: >
      SELECT id AS order_id, ['air','ground','sea'][1 + id % 3] AS carrier_mode,
      ['TX','IL','WA','MA'][1 + id % 4] AS dest_state
      FROM shop.orders
    joins:
      - { name: regions, alias: destination_regions, relationship: many_to_one, sql: "{CUBE}.dest_state = {destination_regions.state}" }
      - { name: region_labels, relationship: many_to_one, sql: "{CUBE}.dest_state = {region_labels.state}" }
    dimensions:
      - { name: order_id, sql: order_id, type: number, primary_key: true, public: false }
      - { name: carrier_mode, sql: carrier_mode, type: string, description: Shipping mode. }
    measures:
      - { name: count, type: count, description: Number of shipments. }

  - name: cheap_products
    title: Cheap products
    description: Cube that extends products and keeps cheap products only.
    extends: products
    sql: "SELECT * FROM shop.products WHERE price < 20"

  - name: filtered_orders
    title: Filtered orders
    description: Cube whose SQL reads FILTER_PARAMS.
    sql: "SELECT * FROM shop.orders WHERE {FILTER_PARAMS.filtered_orders.status.filter('status')}"
    dimensions:
      - { name: id, sql: id, type: number, primary_key: true }
      - { name: status, sql: status, type: string, description: Pushed into the cube SQL. }
      - name: created_berlin
        sql: "{SQL_UTILS.convertTz('created_at')}"
        type: time
        description: Creation time through SQL_UTILS.
    measures:
      - { name: count, type: count, description: Orders that pass the pushed filter. }

  # Each query on this cube fails, see preagg.original_sql in conformance/features.yaml. So it is not public.
  - name: lambda_orders
    public: false
    title: Lambda orders
    description: Cube with original_sql, rollup and lambda pre-aggregations.
    sql: "SELECT id, status, amount, created_at FROM shop.orders"
    dimensions:
      - { name: id, sql: id, type: number, primary_key: true }
      - { name: status, sql: status, type: string, description: Order status. }
      - { name: created_at, sql: created_at, type: time, description: Creation time. }
    measures:
      - { name: revenue, sql: amount, type: sum, format: currency, description: Revenue through pre-aggregations. }
    pre_aggregations:
      - name: base
        type: original_sql
        refresh_key: { every: 1 hour }
        indexes:
          - { name: status_idx, columns: [status] }
      - name: daily
        type: rollup
        use_original_sql_pre_aggregations: true
        measures: [revenue]
        dimensions: [status]
        time_dimension: created_at
        granularity: day
        indexes:
          - { name: status_idx, columns: [status] }
        refresh_key: { every: 1 hour }

  - name: secret_audit
    public: false
    title: Secret audit
    description: Hidden cube. It must not appear in Metabase.
    sql_table: shop.orders
    dimensions:
      - { name: id, sql: id, type: number, primary_key: true }
    measures:
      - { name: count, type: count }

  - name: fiscal_calendar
    calendar: true
    title: Fiscal calendar
    description: Calendar cube with a custom time shift.
    sql: >
      SELECT toDateTime('2024-01-01 00:00:00', 'UTC') + toIntervalDay(number) AS date_key,
      toDateTime('2024-01-01 00:00:00', 'UTC') + toIntervalDay(number) - toIntervalDay(28) AS prior_fiscal_date,
      toDateTime(toStartOfMonth(toDate('2024-01-01') + number + 10), 'UTC') AS fiscal_month_start
      FROM numbers(1200)
    dimensions:
      - { name: date_key, sql: date_key, type: time, primary_key: true }
      - name: date
        sql: date_key
        type: time
        time_shift:
          - { name: prior_fiscal_month, sql: "{CUBE}.prior_fiscal_date" }
        granularities:
          - { name: fiscal_month, sql: "{CUBE}.fiscal_month_start" }
      - { name: fiscal_month, sql: "{date.fiscal_month}", type: time, description: Fiscal month that starts 10 days before the calendar month. }

  - name: second_source_tickets
    data_source: second
    title: Tickets
    description: Cube on a second data source.
    sql: "SELECT * FROM shop_second.tickets"
    dimensions:
      - { name: id, sql: id, type: number, primary_key: true }
      - { name: priority, sql: priority, type: string, description: Priority of the ticket. }
    measures:
      - { name: count, type: count, description: Number of tickets. }
      - { name: total_minutes, sql: minutes, type: sum, description: Minutes of work. }

  - name: refresh_marks
    title: Refresh marks
    description: Cube with a refresh key that reads the table, so a new row refreshes the cache.
    sql: "SELECT * FROM shop.refresh_marks"
    refresh_key:
      sql: "SELECT count() FROM shop.refresh_marks"
    dimensions:
      - { name: id, sql: id, type: number, primary_key: true }
    measures:
      - { name: count, type: count, description: Number of marks. }

  - name: filter_group_orders
    title: Filter group orders
    description: Cube whose SQL reads FILTER_GROUP, so an OR of two filters stays one condition.
    sql: >
      SELECT * FROM shop.orders WHERE
      {FILTER_GROUP(FILTER_PARAMS.filter_group_orders.status.filter('status'), FILTER_PARAMS.filter_group_orders.quantity.filter('quantity'))}
    dimensions:
      - { name: id, sql: id, type: number, primary_key: true }
      - { name: status, sql: status, type: string, description: Order status. }
      - { name: quantity, sql: quantity, type: number, description: Quantity. }
    measures:
      - { name: count, type: count, description: Number of orders. }

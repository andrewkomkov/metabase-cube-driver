# One stack for `make fuzz-native`: the three paths of native SQL behind one Metabase. Cube with the dialect, stock Cube, and Cube as it runs in production. Use it after
# docker-compose.yml, docker-compose.production.yml and docker-compose.grid.yml. All ports bind to the loopback interface only, and NATIVE_PORT_BASE moves them next to another stack.
services:
  clickhouse:
    mem_limit: 1500m
    ports: !override ["127.0.0.1:${NATIVE_PORT_BASE:-2}8123:8123"]
  cube:
    mem_limit: 1536m
    ports: !override ["127.0.0.1:${NATIVE_PORT_BASE:-2}4400:4000"]
  cube-stock:
    mem_limit: 1536m
    ports: !override ["127.0.0.1:${NATIVE_PORT_BASE:-2}4403:4000"]
  cube-prod:
    mem_limit: 1536m
    ports: !override ["127.0.0.1:${NATIVE_PORT_BASE:-2}4405:4000"]
  metabase:
    mem_limit: 2500m
    environment:
      JAVA_OPTS: -Xmx2g
    depends_on: !override [cube, cube-stock, cube-prod]
    ports: !override ["127.0.0.1:${NATIVE_PORT_BASE:-2}3300:3000"]

# Repro stack for docs/cube-findings.md. No Metabase and no driver.
# All ports bind to the loopback interface only. All credentials are throwaway values.
name: mcd-repro
services:
  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-26.8.36-alpine}
    environment:
      CLICKHOUSE_DB: repro
      CLICKHOUSE_USER: repro
      CLICKHOUSE_PASSWORD: repro
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits: { nofile: { soft: 262144, hard: 262144 } }
    mem_limit: 1g
    healthcheck: { test: [CMD-SHELL, "clickhouse-client -u repro --password repro -q 'SELECT 1'"], interval: 2s, retries: 40 }
  postgres:
    image: postgres:${POSTGRES_VERSION:-17-alpine}
    environment:
      POSTGRES_DB: repro
      POSTGRES_USER: repro
      POSTGRES_PASSWORD: repro
    mem_limit: 256m
    healthcheck: { test: [CMD-SHELL, "pg_isready -U repro -d repro"], interval: 2s, retries: 40 }
  cube:
    image: cubejs/cube:${CUBE_VERSION:-v1.8.15}
    env_file:
      - ./lib/base.env
      - path: ${CUBE_ENV_FILE:-./lib/empty.env}
        required: false
    environment:
      CUBEJS_DB_TYPE: ${DB_TYPE:-clickhouse}
      CUBEJS_DB_HOST: ${DB_HOST:-clickhouse}
      CUBEJS_DB_PORT: ${DB_PORT:-8123}
      CUBEJS_TESSERACT_SQL_PLANNER: ${TESSERACT:-true}
    volumes:
      - ./${CLAIM:-lib/empty}/model:/cube/conf/model:ro
      - ${CUBE_JS:-./lib/empty.cube.js}:/cube/conf/cube.js:ro
    ports: ["127.0.0.1:4500:4000", "127.0.0.1:4501:15432"]
    mem_limit: 1g

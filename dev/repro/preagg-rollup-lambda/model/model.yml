cubes:
  - name: orders
    sql_table: repro.orders
    dimensions:
      - { name: id, sql: id, type: number, primary_key: true, public: true }
      - { name: status, sql: status, type: string }
      - { name: created_at, sql: created_at, type: time }
    measures:
      - { name: revenue, sql: amount, type: sum }
    pre_aggregations:
      - name: lambda
        type: rollup_lambda
        union_with_source_data: true
        rollups: [orders.batch]
      - name: batch
        measures: [revenue]
        dimensions: [status]
        time_dimension: created_at
        granularity: day
        partition_granularity: month
        build_range_start: { sql: "SELECT '2025-05-01 00:00:00'" }
        build_range_end: { sql: "SELECT '2025-05-31 23:59:59'" }
        refresh_key: { every: 1 hour }
        indexes:
          - { name: status_idx, columns: [status] }

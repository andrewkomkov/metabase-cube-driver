# Packages the driver, starts the demo stack and runs the conformance suite.
# Runs on GitHub-hosted runners only, because this repository is public. It uses no secrets: the
# demo stack has fixed throwaway credentials for fake data.
name: conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Start ClickHouse and Cube
        working-directory: dev
        run: docker compose up -d --wait clickhouse cube

      - name: Check that Cube agrees with ClickHouse
        working-directory: dev
        run: |
          truth=$(docker compose exec -T clickhouse clickhouse-client -u shop --password shop-dev-only \
            -q 'SELECT count() FROM shop.orders' </dev/null)
          got=
          for _ in $(seq 1 60); do
            got=$(curl -sS -G http://127.0.0.1:4400/cubejs-api/v1/load \
              --data-urlencode 'query={"measures":["orders.count"]}' \
              | jq -r '.data[0]["orders.count"] // empty' || true)
            [ -n "$got" ] && break
            sleep 3
          done
          echo "clickhouse=$truth cube=$got"
          [ "$truth" = "$got" ]

      - name: Package the driver
        run: scripts/package.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cube.metabase-driver
          path: dev/plugins/cube.metabase-driver.jar
          if-no-files-found: error

      - name: Start Metabase
        working-directory: dev
        run: |
          docker compose up -d --wait metabase
          for _ in $(seq 1 100); do
            curl -fsS http://127.0.0.1:3300/api/health && exit 0
            sleep 3
          done
          echo "Metabase did not become healthy"
          exit 1

      - name: Run conformance
        run: |
          if [ -f conformance/requirements.txt ]; then
            python -m pip install -r conformance/requirements.txt
          fi
          python conformance/run.py

      - name: Show stack logs
        if: failure()
        working-directory: dev
        run: docker compose logs --no-color --tail 300

      - name: Stop the stack
        if: always()
        working-directory: dev
        run: docker compose down -v

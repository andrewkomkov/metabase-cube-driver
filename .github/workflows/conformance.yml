# Runs on request. update-pins dispatches this workflow, because pull requests from GITHUB_TOKEN start
# no workflows. With a pull request number it also tests the base branch, compares the pass counts,
# reports on the pull request and merges only if the pass count did not fall.
name: conformance

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Number of the pull request to report on and gate. Empty means run the suite only.
        type: string
        default: ""
      base-ref:
        description: Branch that gives the baseline.
        type: string
        default: main

permissions: {}

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    uses: ./.github/workflows/reusable-stack.yml
    permissions:
      contents: read
    with:
      name: candidate
      artifact-name: conformance-candidate

  baseline:
    if: inputs.pr != ''
    uses: ./.github/workflows/reusable-stack.yml
    permissions:
      contents: read
    with:
      name: baseline
      artifact-name: conformance-baseline
      ref: ${{ inputs.base-ref }}
      report-only: true

  gate:
    name: pin gate
    needs: [candidate, baseline]
    if: ${{ !cancelled() && inputs.pr != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: conformance-*
          path: cells
      - name: Compare the pass counts
        id: compare
        run: python3 .github/scripts/report.py compare cells/conformance-baseline cells/conformance-candidate | tee diff.md
      - name: Report and decide
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          DECISION: ${{ steps.compare.outputs.decision }}
          BASE_PASS: ${{ steps.compare.outputs.base_pass }}
          CANDIDATE_PASS: ${{ steps.compare.outputs.candidate_pass }}
          AUTOMERGE: ${{ vars.PINS_AUTOMERGE }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/pin_gate.sh diff.md

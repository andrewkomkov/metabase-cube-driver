name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

# A pull request cancels its older runs. On main a run finishes and the newest push waits, because
# frequent pushes would otherwise cancel every run and main would have no result.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    uses: ./.github/workflows/reusable-lint.yml
    permissions:
      contents: read

  build:
    uses: ./.github/workflows/reusable-build.yml
    permissions:
      contents: read

  load-check:
    uses: ./.github/workflows/reusable-stack.yml
    permissions:
      contents: read
    with:
      name: jar load check
      artifact-name: load-pinned
      conformance: false

  conformance:
    uses: ./.github/workflows/reusable-stack.yml
    permissions:
      contents: read
    with:
      name: conformance on the pinned pair
      artifact-name: conformance-pinned
      load-check: false

  conformance-stock:
    uses: ./.github/workflows/reusable-stack.yml
    permissions:
      contents: read
    with:
      name: conformance on the pinned pair with stock Cube
      artifact-name: conformance-pinned-stock
      load-check: false
      clickhouse-fixes: "off"

  # Dev mode reads private members and accepts each JWT, so the suite above says nothing about these. See dev/review/README.md.
  production:
    name: a sample on Cube with dev mode off and Cube Store
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      PRODUCTION_OUT: ci-out
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-jar
      - name: Make the plugins directory usable by the Metabase container
        run: |
          chmod 777 dev/plugins
          chmod 644 dev/plugins/cube.metabase-driver.jar
      - name: Run the sample
        run: make production
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: production-sample
          path: ci-out
          if-no-files-found: ignore
          retention-days: 14

  status:
    needs: conformance
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    uses: ./.github/workflows/reusable-status.yml
    permissions:
      actions: write
      contents: write

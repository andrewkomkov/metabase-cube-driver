# Manual entry to the release pipeline. Without a tag it is a dry run. With a tag it verifies and
# publishes an existing draft release, for example after a failure of the runner.
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of a draft release. Empty means a dry run of the current ref.
        type: string
        default: ""

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/reusable-release.yml
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    with:
      tag: ${{ inputs.tag }}
      dry-run: ${{ inputs.tag == '' }}

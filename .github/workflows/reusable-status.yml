# Writes the badges and generated pages from the conformance-* artifacts of this run to the branch "status".
name: reusable-status

on:
  workflow_call:
    inputs:
      compat:
        description: Also write the compatibility table from all cells.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  status:
    name: publish status
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: status-branch
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: conformance-*
          path: cells
      - name: Generate the status files
        env:
          COMPAT: ${{ inputs.compat }}
        run: |
          if [ "$COMPAT" = true ]; then
            python3 .github/scripts/report.py status cells status-out --compat
          else
            python3 .github/scripts/report.py status cells status-out
          fi
          cat status-out/badges/*.json
      - name: Publish the status files
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/publish_status.sh status-out
      - name: Rebuild the docs site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"

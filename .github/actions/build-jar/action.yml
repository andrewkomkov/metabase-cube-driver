name: Build the driver jar
description: Runs scripts/package.sh, checks the jar contents and reports its version and SHA-256.
outputs:
  path:
    description: Path of the jar.
    value: dev/plugins/cube.metabase-driver.jar
  sha256:
    description: SHA-256 of the jar.
    value: ${{ steps.check.outputs.sha256 }}
  version:
    description: Version from the plugin manifest.
    value: ${{ steps.check.outputs.version }}
runs:
  using: composite
  steps:
    - name: Package the driver
      shell: bash
      run: scripts/package.sh
    - name: Check the jar
      id: check
      shell: bash
      run: |
        jar=dev/plugins/cube.metabase-driver.jar
        unzip -l "$jar" | grep -q ' metabase-plugin.yaml$' || { echo "::error::the jar has no plugin manifest"; exit 1; }
        unzip -l "$jar" | grep -q ' metabase/driver/cube.clj$' || { echo "::error::the jar has no driver namespace"; exit 1; }
        version=$(unzip -p "$jar" metabase-plugin.yaml | sed -n 's/^  version: *//p' | head -n 1)
        [ -n "$version" ] || { echo "::error::the manifest has no version"; exit 1; }
        sha256=$(sha256sum "$jar" | cut -d' ' -f1)
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
        echo "Built version \`$version\`, SHA-256 \`$sha256\`." >> "$GITHUB_STEP_SUMMARY"

- id: compile.bound.datetime64_whole_seconds_limit
  area: mb.compile.bound
  title: "strict bound on DateTime64 reads whole seconds"
  status: todo
  check: compile.bound.datetime64_whole_seconds_limit
  cap: partial
  reason: "The ClickHouse dialect of Cube reads a time as whole seconds in a filter, so a row in the first second after a bound of > is out of the result. /v1/meta does not show the column type, so the driver cannot avoid this. A dimension with sql: toString(column) keeps the text. A subclass of ClickHouseQuery can fix this, see docs/cube-findings.md."
- id: native.count_on_no_rows_limit
  area: mb.native
  title: "native COUNT(*) on no rows"
  status: todo
  check: native.count_on_no_rows_limit
  cap: partial
  reason: "Limit of Cube: native COUNT(*) on no rows gives NULL where SQL gives 0 (m3). The driver does not change native text, and it cannot know that a NULL column is a count. MBQL gives 0."
- id: security.dev_mode_warning_for_hidden_members
  area: security
  title: "native SQL reads hidden members in dev mode"
  status: todo
  check: security.dev_mode_warning_for_hidden_members
  cap: partial
  reason: "Limit of Cube: with CUBEJS_DEV_MODE=true the SQL API reads hidden cubes and members (m6). A Cube with dev mode off refuses this query. docs/security.md warns about it."
- id: security.validate_echoes_the_request_limit

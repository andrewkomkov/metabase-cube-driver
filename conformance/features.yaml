- id: dimension.opt.propagate_filters_next_to_another_sub_query
  area: cube.dimensions
  title: "propagate filters next to another sub query"
  status: partial
  check: dimension.opt.propagate_filters_next_to_another_sub_query
  cap: partial
  reason: "Wrong number from Cube with the Tesseract planner. When two sub_query dimensions have equal SQL, the generated SQL joins both subqueries and selects the first for both columns, so the propagated dimension shows the other value. Alone, it is right, see dimension.opt.propagate_filters. With other SQL, such as {orders.count} + 0, it gives the truth."
- id: measure.multi_stage.time_shift_no_bucket_limit
  area: cube.measures
  title: "time shift with no time bucket"
  status: partial
  check: measure.multi_stage.time_shift_no_bucket_limit
  cap: partial
  reason: "Unclear intent. With no time bucket, a time shift measure gives the total of all rows, because a sum over all time does not change after a shift. With a date range it gives the value of the earlier month. /v1/meta does not tell which measure has a time shift, so the driver cannot ask for a time bucket here. Group by a time bucket."
- id: clickhouse.datetime64_millis
  area: cube.clickhouse
  title: "DateTime64 milliseconds"
  status: partial
  check: clickhouse.datetime64_millis
  cap: partial
  reason: "The ClickHouse dialect of Cube reads a time as whole seconds. A raw value has no milliseconds, and a filter on them finds no row. Postgres keeps them. Buckets of a second and above are right. A dimension with sql: toString(column) keeps the text. A subclass of ClickHouseQuery can fix this, see docs/cube-findings.md."

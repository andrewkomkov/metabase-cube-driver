  area: cube.dimensions
  title: "granularity custom offset"
  status: partial
  status_stock: partial
  check: granularity.custom.offset
  cap: partial
  reason: "Cube Store puts a time before the origin of a custom granularity in months in the wrong bin, and no released Cube has a fix. The driver stops such a query when a rollup serves the measure and the data starts before the origin. An offset has its origin in the current year, so this stops most offsets on a rollup. A measure that no rollup serves gives the truth. An origin before all rows gives the truth on a rollup."

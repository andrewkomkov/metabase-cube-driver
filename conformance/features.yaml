- id: granularity.custom.offset
  area: cube.dimensions
  title: "granularity custom offset"
  status: blocked
  reason: "Wrong number from Cube Store: a time before the origin of a custom granularity gets the wrong bin. An offset uses an origin in the current year, so old rows on a rollup of months go wrong: Cube gives 2025-02-01 825 and 2025-05-01 1288, and the truth is 2024-11-01 433 and 2025-02-01 1246. A measure that the rollup does not serve is right, see compile.granularity.native_offset_no_rollup. The driver cannot see this. Use an origin before all rows, such as 2000-02-01, in place of an offset."
